<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Content Security Policy.

      GitHub Pages serves static files and cannot set headers, so this is a meta
      policy, which is weaker but not nothing. It is deliberately tight: this app
      loads no third-party script, no remote font and no analytics, so the only
      origins it needs are itself, the GitHub API it publishes through, and
      data: URLs for the inline paper-grain texture.

      The one inline script is the theme applied before first paint, which has
      to run inline or dark mode flashes white. Its hash is computed and
      substituted by scripts/post-build.mjs, because a hash maintained by hand
      drifts the moment anyone touches the script and fails silently.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' '__INLINE_SCRIPT_HASH__'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="alternate icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F3E9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151230" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FBC Agbede" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />

    <title>First Baptist Church Agbede, Ikorodu · Chapel of Grace</title>
    <meta
      name="description"
      content="Chapel of Grace. Worship times, sermons, events, daily devotionals and church life at First Baptist Church Agbede, Ikorodu."
    />
    <meta property="og:title" content="First Baptist Church Agbede, Ikorodu" />
    <meta property="og:description" content="Chapel of Grace. A household of faith in Ikorodu." />
    <meta property="og:type" content="website" />

    <!--
      Theme is applied before first paint so the app never flashes the wrong palette.
      Kept inline and tiny on purpose; it must run synchronously.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fbc.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>First Baptist Church Agbede, Ikorodu</h1>
        <p>This app needs JavaScript enabled. Please turn it on and reload.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
